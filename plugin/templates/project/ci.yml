# 필수 검사. 머지 큐를 쓰면 merge_group 트리거가 꼭 있어야 한다(없으면 큐가 검사 결과를 기다리다 실패한다).
# 빌드·테스트가 생기면 developer가 같은 파일에 `check` job을 추가하고, setup-repo.sh 를 필수 검사 이름을 모두 넘겨 다시 돌린다.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  git-policy:
    uses: '{{GITHUB_ORG}}/.github/.github/workflows/git-policy.yml@main'

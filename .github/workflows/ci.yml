name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 머지 큐가 최신 main 과 합친 임시 브랜치에서 필수 검사를 다시 돌린다. 이 트리거가 없으면 큐가 결과를 기다리다 실패한다.
  merge_group:

permissions:
  contents: read

jobs:
  # 이 job 이름(check)과 git-policy / merge-commits 가 main 병합의 필수 조건이다. 이름을 바꾸면 GitHub 의 main 규칙(필수 검사)도 같이 바꿔야 한다.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # pull_request 이벤트 값을 쓰므로 PR 에서만 돈다. 머지 큐 실행은 PR 에서 이미 검사한 커밋을 합친 것이다.
      - name: 커밋 메시지 형식
        if: github.event_name == 'pull_request'
        run: scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  # autelon 조직 공통 규칙: PR 에 merge 커밋이 있으면 실패한다 (작업 브랜치는 rebase 로만 최신화).
  git-policy:
    uses: autelon/.github/.github/workflows/git-policy.yml@main
